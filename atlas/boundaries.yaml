summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: packages
    globs:
      - packages/**
    role: data
  - name: root
    globs:
      - "*"
    role: config
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: site
    globs:
      - site/**
    role: site
  - name: tests
    globs:
      - tests/**
    role: test
