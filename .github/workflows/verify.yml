name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-flight run when a newer commit lands on the same ref.
# head_ref names the PR branch on pull_request and is empty elsewhere, so a
# push and its PR run share one group instead of both going to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Atlas needs Node 22 or later; the job's own Node 20 is set up after it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.21.0 check

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify all packages
        run: node scripts/verify-pack.mjs packages/*

      - name: Dependency audit
        run: npm audit --audit-level=high
